spring.application.name=nearfix

# Server Configuration - IMPORTANT for Railway
server.port=${PORT:8080}

# Database Configuration (using environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.defer-datasource-initialization=true

#SQLInitialization for Data seeding
spring.sql.init.mode=always

# JWT Configuration (using environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}


# MSG91 Configuration for SMS/OTP
# Set msg91.enabled=false to log messages instead of calling the MSG91 API (useful for local dev)
msg91.enabled=${MSG91_ENABLED:true}
msg91.authkey=${MSG91_AUTHKEY}
msg91.otp-template-id=${MSG91_OTP_TEMPLATE_ID:}
msg91.notification-template-id=${MSG91_NOTIFICATION_TEMPLATE_ID:}
msg91.country-code=${MSG91_COUNTRY_CODE:91}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Razorpay Configuration (using environment variables)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.timeout=${RAZORPAY_TIMEOUT:300000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.nearfix=INFO
logging.level.org.springframework.security=WARN

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=2000ms