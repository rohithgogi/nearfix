spring.application.name=nearfix

# Server Configuration - IMPORTANT for Railway
server.port=${PORT:8080}

# Database Configuration (using environment variables)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nearfix}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (using environment variables)
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# AWS Configuration (using environment variables)
aws.region=${AWS_REGION:ap-south-1}
aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}

# SNS Configuration
aws.sns.sender-id=${AWS_SNS_SENDER_ID:NearFix}
aws.sns.enabled=${AWS_SNS_ENABLED:true}
aws.sns.mock-mode=${AWS_SNS_MOCK_MODE:true}

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
file.upload-dir=${FILE_UPLOAD_DIR:./uploads}

# Razorpay Configuration (using environment variables)
razorpay.key-id=${RAZORPAY_KEY_ID}
razorpay.key-secret=${RAZORPAY_KEY_SECRET}
razorpay.timeout=${RAZORPAY_TIMEOUT:300000}

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# Server Configuration
server.error.include-message=always
server.error.include-binding-errors=always

# Logging
logging.level.com.nearfix=INFO
logging.level.org.springframework.security=WARN